[package]
name = "blueos-updates"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.18.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = { version = "0.2.39", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
utoipa = { version = "6.0.0", features = ["actix_extras", "jiff_0_2"] }
utoipa-actix-web = "0.2.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["actix-web", "gzip", "minified", "vendored"] }
